# =============================================================================
# Overex backend — default configuration
#
# Every value below has a sensible default so the service runs straight after a
# clone (`./mvnw spring-boot:run` + the docker-compose Postgres). Anything you
# would change per environment is overridable via an environment variable using
# the ${ENV_VAR:default} syntax — no code or file edits required in production.
# =============================================================================

spring.application.name=overex-backend

# ---- Database (PostgreSQL — started by the root docker-compose.yml) ----------
# DB_URL / DB_USER / DB_PASSWORD let you point at any Postgres without touching
# this file. The defaults match docker-compose.yml.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/overex}
spring.datasource.username=${DB_USER:overex}
spring.datasource.password=${DB_PASSWORD:overex}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ---------------------------------------------------------
# 'update' auto-creates/updates the schema from the @Entity classes — great for
# getting started. Switch to a migration tool (Flyway/Liquibase) for production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---- API ---------------------------------------------------------------------
# Every route is served under this prefix, e.g. POST /api/v1/auth/sign-in.
# The Next.js frontend expects exactly this prefix (see apps/web).
server.servlet.context-path=/api/v1

# ---- JWT signing keys (RS256) ------------------------------------------------
# PEM files: PKCS#8 private key (signs tokens), X.509 public key (verifies them).
jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION:file:./keys/private.pem}
jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:file:./keys/public.pem}
# When neither file exists, generate a fresh pair on startup (DevKeyGenerator),
# so a fresh clone just runs. The Docker image turns this off: in production
# missing keys must stop the service instead of silently creating new ones.
jwt.generate-missing-keys=${JWT_GENERATE_MISSING_KEYS:true}

# ---- Logging -----------------------------------------------------------------
logging.level.org.springframework.security=INFO
