# =============================================================================
# Overex backend — "e2e" profile
#
# Activated with `--spring.profiles.active=e2e`. Points the service at the
# throwaway Postgres started by docker-compose.test.yml (port 5433) and runs on
# port 8081 so it can sit next to a normally-running dev backend. The schema is
# recreated on every boot so end-to-end runs always start from a clean slate.
# =============================================================================

# ---- Throwaway test database (docker-compose.test.yml) ----------------------
spring.datasource.url=jdbc:postgresql://localhost:5433/overex-test
spring.datasource.username=testuser
spring.datasource.password=testpass
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- Hibernate: clean schema every boot -------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Don't let Spring Boot auto-manage docker-compose for this profile; we start the
# test database ourselves.
spring.docker.compose.enabled=false

# ---- Separate port so it can run alongside the dev backend on 8080 ----------
server.port=8081
