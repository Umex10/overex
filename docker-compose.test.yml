# =============================================================================
# Overex — throwaway test database
#
#   docker compose -f docker-compose.test.yml up -d
#
# Spins up an isolated Postgres on port 5433 for end-to-end / integration runs,
# so tests never touch your real dev database (port 5432). The backend connects
# to it via the "e2e" Spring profile:
#
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=e2e   (runs on port 8081)
# =============================================================================

# Own project name: without it, Compose names the project after the folder
# ("overex"), the same as docker-compose.yml. Both would then share one network,
# and "down" here would warn about the dev containers as orphans.
name: overex-test

services:
  db-test:
    image: postgres:17.7
    container_name: overex-test-db
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: overex-test
    ports:
      - "5433:5432"
    # "up --wait" (npm run e2e:db-up) blocks until this succeeds. -h 127.0.0.1:
    # while the image sets itself up, Postgres only listens on its Unix socket;
    # without -h it would already count as ready during that phase.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U testuser -d overex-test"]
      interval: 1s
      timeout: 5s
      retries: 30
    # No named volume: the data is meant to be disposable.
