# =============================================================================
# Overex — throwaway test database
#
#   docker compose -f docker-compose.test.yml up -d
#
# Spins up an isolated Postgres on port 5433 for end-to-end / integration runs,
# so tests never touch your real dev database (port 5432). The backend connects
# to it via the "e2e" Spring profile:
#
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=e2e   (runs on port 8081)
# =============================================================================

services:
  db-test:
    image: postgres:17.7
    container_name: overex-test-db
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: overex-test
    ports:
      - "5433:5432"
    # No named volume: the data is meant to be disposable.
