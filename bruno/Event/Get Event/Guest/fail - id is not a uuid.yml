info:
  name: fail - id is not a uuid
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/events/abc"
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("names eventId as the invalid field", function () {
          const fields = res.getBody().errors.map((e) => e.field);
          expect(fields).to.include("eventId");
        });

        test("explains the error in a message", function () {
          const error = res.getBody().errors.find((e) => e.field === "eventId");
          expect(error.message).to.be.a("string").and.not.be.empty;
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
