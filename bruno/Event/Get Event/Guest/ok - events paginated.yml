info:
  name: ok - events paginated
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/event?page=1&size=5"
  params:
    - name: page
      value: "1"
      type: query
    - name: size
      value: "5"
      type: query
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("returns the requested page", function () {
          expect(body.page.number).to.equal(1);
        });

        test("returns at most the requested page size", function () {
          expect(body.page.size).to.equal(5);
          expect(body.content.length).to.be.at.most(5);
        });

        test("the total page count fits the total element count", function () {
          expect(body.page.totalPages).to.equal(Math.ceil(body.page.totalElements / 5));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
