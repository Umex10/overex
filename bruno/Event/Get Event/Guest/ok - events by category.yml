info:
  name: ok - events by category
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/events?categoryId={{categoryId}}"
  params:
    - name: categoryId
      value: "{{categoryId}}"
      type: query
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("returns events", function () {
          expect(body.content).to.be.an("array").that.is.not.empty;
        });

        test("every event belongs to the requested category", function () {
          body.content.forEach((e) => expect(e.category.id).to.equal(bru.getVar("categoryId")));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
