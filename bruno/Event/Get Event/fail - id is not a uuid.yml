info:
  name: fail - id is not a uuid
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/event/abc"
  auth:
    type: bearer
    token: "{{accessTk}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errors[0].field
      operator: eq
      value: "eventId"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
