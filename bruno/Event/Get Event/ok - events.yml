info:
  name: ok - events
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/events"
  auth:
    type: bearer
    token: "{{accessTk}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("returns a page with content and paging info", function () {
          expect(body.content).to.be.an("array").that.is.not.empty;
          expect(body.page).to.include.all.keys("size", "number", "totalElements", "totalPages");
        });

        test("uses the default page size of 10", function () {
          expect(body.page.size).to.equal(10);
          expect(body.content.length).to.be.at.most(10);
        });

        test("sorts the events by start time, earliest first", function () {
          const starts = body.content.map((e) => new Date(e.startsAt).getTime());
          const sorted = [...starts].sort((a, b) => a - b);
          expect(starts).to.deep.equal(sorted);
        });

        test("every event carries its category", function () {
          body.content.forEach((e) => expect(e.category.title).to.be.a("string"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
