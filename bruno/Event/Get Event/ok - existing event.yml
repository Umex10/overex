info:
  name: ok - existing event
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/event/{{eventId}}"
  auth:
    type: bearer
    token: "{{accessTk}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: eq
      value: "{{eventId}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
