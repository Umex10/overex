info:
  name: ok - create event
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/event"
  body:
    type: json
    data: |-
      {
        "title": "Frequency Festival 2027",
        "description": "Drei Tage Musik am Traisenpark in St. Pölten mit internationalen Headlinern.",
        "categoryId": "{{categoryId}}",
        "venue": "Green Park",
        "city": "St. Pölten",
        "startsAt": "2027-08-12T14:00:00Z",
        "saleStartsAt": "2026-11-01T10:00:00Z",
        "imageUrl": "https://images.unsplash.com/photo-1459749411175-04bf5292ceea"
      }
  auth:
    type: bearer
    token: "{{accessTk}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("eventId", res.getBody().id);
    - type: tests
      code: |-
        const event = res.getBody();

        test("returns the new event with an id", function () {
          expect(event.id).to.match(/^[0-9a-f-]{36}$/);
        });

        test("starts as a draft", function () {
          expect(event.status).to.equal("DRAFT");
        });

        test("stores the sent values", function () {
          expect(event.title).to.equal("Frequency Festival 2027");
          expect(event.city).to.equal("St. Pölten");
          expect(event.startsAt).to.equal("2027-08-12T14:00:00Z");
        });

        test("links the chosen category", function () {
          expect(event.category.id).to.equal(bru.getVar("categoryId"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
