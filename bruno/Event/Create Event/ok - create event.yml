info:
  name: ok - create event
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/event"
  body:
    type: json
    data: |
      {
        "title": "Frequency Festival 2027",
        "description": "Drei Tage Musik am Traisenpark in St. Pölten mit internationalen Headlinern.",
        "venue": "Green Park",
        "city": "St. Pölten",
        "startsAt": "2027-08-12T14:00:00Z",
        "saleStartsAt": "2026-11-01T10:00:00Z",
        "imageUrl": "https://images.unsplash.com/photo-1459749411175-04bf5292ceea"
      }
  auth:
    type: bearer
    token: "{{accessTk}}"

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: eventId
        scope: runtime
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.status
      operator: eq
      value: "DRAFT"
    - expression: res.body.title
      operator: eq
      value: "Frequency Festival 2027"
    - expression: res.body.id
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
