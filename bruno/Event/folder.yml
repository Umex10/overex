info:
  name: Event
  type: folder
  seq: 3

request:
  auth: inherit
  scripts:
    - type: before-request
      code: |-
        // Requests on {{eventId}} need an event of their own. When none is set yet
        // (e.g. a request is run on its own), a throwaway test event is created, so the
        // seed events are never changed or deleted. POSTs are skipped: "ok - create
        // event" sets eventId itself.
        if (req.getMethod() !== "POST" && !bru.getVar("eventId")) {
          const res = await bru.sendRequest({
            method: "POST",
            url: `${bru.getEnvVar("baseUrl")}/event`,
            headers: { Authorization: `Bearer ${bru.getVar("accessTk")}` },
            data: {
              title: "Bruno Testevent",
              description: "Created by the Bruno collection.",
              categoryId: bru.getVar("categoryId"),
              venue: "Green Park",
              city: "St. Pölten",
              startsAt: "2027-08-12T14:00:00Z",
              saleStartsAt: "2026-11-01T10:00:00Z",
              imageUrl: "https://images.unsplash.com/photo-1459749411175-04bf5292ceea",
            },
          });
          bru.setVar("eventId", res.data.id);
        }
