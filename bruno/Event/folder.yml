info:
  name: Event
  type: folder
  seq: 4

request:
  auth: inherit
  scripts:
    - type: before-request
      code: |-
        // Every request gets a fresh draft of its own in {{eventId}} / {{eventVersion}},
        // so each one runs alone, in any order, and never touches the seed events.
        // "Create Event" creates its own event instead.
        bru.deleteVar("eventId");
        if (req.getMethod() !== "POST") {
          const draft = await bru.sendRequest({
            method: "POST",
            url: `${bru.getEnvVar("baseUrl")}/events`,
            headers: { Authorization: `Bearer ${bru.getVar("accessTk")}` },
            data: {
              title: "Bruno Testevent",
              description: "Created by the Bruno collection.",
              categoryId: bru.getVar("categoryId"),
              venue: "Green Park",
              city: "St. Pölten",
              startsAt: "2099-08-12T14:00:00Z",
              saleStartsAt: "2099-03-01T10:00:00Z",
              imageUrl: "https://images.unsplash.com/photo-1459749411175-04bf5292ceea",
              status: "DRAFT",
            },
          });
          bru.setVar("eventId", draft.data.id);
          bru.setVar("eventVersion", draft.data.version);
        }
    - type: tests
      code: |-
        // Removes the event again, so a run leaves no events behind. Runs after the
        // request's own tests. 404 is fine: the request itself deleted the event.
        const eventId = bru.getVar("eventId");
        if (eventId) {
          try {
            await bru.sendRequest({
              method: "DELETE",
              url: `${bru.getEnvVar("baseUrl")}/events/${eventId}`,
              headers: { Authorization: `Bearer ${bru.getVar("accessTk")}` },
            });
          } catch (err) {
            if ((err.status ?? err.response?.status) !== 404) throw err;
          }
        }
