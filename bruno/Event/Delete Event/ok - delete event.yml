info:
  name: ok - delete event
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseUrl}}/event/{{eventId}}"
  auth:
    type: bearer
    token: "{{accessTk}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("answers without a body", function () {
          expect(res.getBody() || "").to.be.empty;
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
