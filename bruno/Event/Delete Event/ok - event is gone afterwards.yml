info:
  name: ok - event is gone afterwards
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/events/{{eventId}}"
  auth:
    type: bearer
    token: "{{accessTk}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        // The event is gone: the next run creates a new one instead of reusing this id.
        bru.deleteVar("eventId");
    - type: tests
      code: |-
        test("the deleted event can no longer be loaded", function () {
          expect(res.getBody().error).to.equal("Not Found");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
