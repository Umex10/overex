info:
  name: ok - list events page 2 with size 5 (200)
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/events?page=1&size=5"
  params:
    - name: page
      value: "1"
      type: query
    - name: size
      value: "5"
      type: query
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns the requested page and size", function () {
          const body = res.getBody();
          expect(body.page.number).to.equal(1);
          expect(body.page.size).to.equal(5);
          expect(body.content.length).to.be.at.most(5);
          expect(body.page.totalPages).to.equal(Math.ceil(body.page.totalElements / 5));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
