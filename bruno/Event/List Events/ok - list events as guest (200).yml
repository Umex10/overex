info:
  name: ok - list events as guest (200)
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/events"
  auth:
    type: none

runtime:
  scripts:
    - type: before-request
      code: |-
        // Arrange: publish the draft first.
        const changed = await bru.sendRequest({
          method: "PATCH",
          url: `${bru.getEnvVar("baseUrl")}/events/${bru.getVar("eventId")}`,
          headers: { Authorization: `Bearer ${bru.getVar("accessTk")}` },
          data: {
            title: "Bruno Testevent",
            description: "Created by the Bruno collection.",
            categoryId: bru.getVar("categoryId"),
            venue: "Green Park",
            city: "St. Pölten",
            startsAt: "2099-08-12T14:00:00Z",
            saleStartsAt: "2099-03-01T10:00:00Z",
            imageUrl: "https://images.unsplash.com/photo-1459749411175-04bf5292ceea",
            status: "PUBLISHED",
            version: bru.getVar("eventVersion"),
          },
        });
        bru.setVar("eventVersion", changed.data.version);
    - type: tests
      code: |-
        test("returns a page of 10 events, earliest start first", function () {
          const body = res.getBody();
          expect(body.content).to.be.an("array").that.is.not.empty;
          expect(body.page).to.include.all.keys("size", "number", "totalElements", "totalPages");
          expect(body.page.size).to.equal(10);
          expect(body.content.length).to.be.at.most(10);
          const starts = body.content.map((e) => new Date(e.startsAt).getTime());
          expect(starts).to.deep.equal([...starts].sort((a, b) => a - b));
        });

        test("every event carries its category", function () {
          res.getBody().content.forEach((e) => expect(e.category.title).to.be.a("string"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
