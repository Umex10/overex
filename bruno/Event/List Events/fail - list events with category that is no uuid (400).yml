info:
  name: fail - list events with category that is no uuid (400)
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/events?categoryId=abc"
  params:
    - name: categoryId
      value: "abc"
      type: query
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("names categoryId as the invalid field and says why", function () {
          const error = res.getBody().errors.find((e) => e.field === "categoryId");
          expect(error, "error on categoryId").to.exist;
          expect(error.message).to.be.a("string").and.not.be.empty;
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
