info:
  name: ok - count my events per status (200)
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/me/events/counts"
  auth:
    type: bearer
    token: "{{accessTk}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("counts every tab, and the tabs add up to all events", function () {
          const c = res.getBody();
          expect(c.countOfDraftEvents).to.be.at.least(1);
          expect(c.countOfAllEvents).to.equal(
            c.countOfDraftEvents + c.countOfPublishedEvents + c.countOfCanceledEvents + c.countOfFinishedEvents
          );
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
