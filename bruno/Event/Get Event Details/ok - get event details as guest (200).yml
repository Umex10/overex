info:
  name: ok - get event details as guest (200)
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/events/{{eventId}}"
  auth:
    type: none

runtime:
  scripts:
    - type: before-request
      code: |-
        // Arrange: publish the draft first.
        const changed = await bru.sendRequest({
          method: "PATCH",
          url: `${bru.getEnvVar("baseUrl")}/events/${bru.getVar("eventId")}`,
          headers: { Authorization: `Bearer ${bru.getVar("accessTk")}` },
          data: {
            title: "Bruno Testevent",
            description: "Created by the Bruno collection.",
            categoryId: bru.getVar("categoryId"),
            venue: "Green Park",
            city: "St. Pölten",
            startsAt: "2099-08-12T14:00:00Z",
            saleStartsAt: "2099-03-01T10:00:00Z",
            imageUrl: "https://images.unsplash.com/photo-1459749411175-04bf5292ceea",
            status: "PUBLISHED",
            version: bru.getVar("eventVersion"),
          },
        });
        bru.setVar("eventVersion", changed.data.version);
    - type: tests
      code: |-
        test("returns the requested event with every field the frontend reads", function () {
          const { event } = res.getBody();
          expect(event.id).to.equal(bru.getVar("eventId"));
          expect(event).to.include.all.keys(
            "id", "version", "title", "description", "venue", "city", "startsAt",
            "saleStartsAt", "imageUrl", "status", "category"
          );
        });

        test("tells which status changes are allowed", function () {
          const { statusOptions } = res.getBody();
          expect(statusOptions.DRAFT.disabled).to.equal(false);
          expect(statusOptions.PUBLISHED.disabled).to.equal(false);
          expect(statusOptions.CANCELED.disabled).to.equal(false);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
