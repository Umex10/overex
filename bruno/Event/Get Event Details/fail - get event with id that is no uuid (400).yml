info:
  name: fail - get event with id that is no uuid (400)
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/events/abc"
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("names eventId as the invalid field and says why", function () {
          const error = res.getBody().errors.find((e) => e.field === "eventId");
          expect(error, "error on eventId").to.exist;
          expect(error.message).to.be.a("string").and.not.be.empty;
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
