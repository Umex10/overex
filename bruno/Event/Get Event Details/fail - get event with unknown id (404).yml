info:
  name: fail - get event with unknown id (404)
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/events/00000000-0000-0000-0000-000000000000"
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("answers with the common error body", function () {
          const error = res.getBody();
          expect(error.status).to.equal(404);
          expect(error.message).to.include("00000000-0000-0000-0000-000000000000");
          expect(error.path).to.be.a("string").and.not.be.empty;
          expect(error.errors).to.deep.equal([]);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
