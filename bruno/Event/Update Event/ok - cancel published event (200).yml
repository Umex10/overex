info:
  name: ok - cancel published event (200)
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/events/{{eventId}}"
  body:
    type: json
    data: |-
      {
        "title": "Bruno Testevent",
        "description": "Created by the Bruno collection.",
        "categoryId": "{{categoryId}}",
        "venue": "Green Park",
        "city": "St. Pölten",
        "startsAt": "2099-08-12T14:00:00Z",
        "saleStartsAt": "2099-03-01T10:00:00Z",
        "imageUrl": "https://images.unsplash.com/photo-1459749411175-04bf5292ceea",
        "status": "CANCELED",
        "version": {{eventVersion}}
      }
  auth:
    type: bearer
    token: "{{accessTk}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        // Arrange: publish the draft first.
        const changed = await bru.sendRequest({
          method: "PATCH",
          url: `${bru.getEnvVar("baseUrl")}/events/${bru.getVar("eventId")}`,
          headers: { Authorization: `Bearer ${bru.getVar("accessTk")}` },
          data: {
            title: "Bruno Testevent",
            description: "Created by the Bruno collection.",
            categoryId: bru.getVar("categoryId"),
            venue: "Green Park",
            city: "St. Pölten",
            startsAt: "2099-08-12T14:00:00Z",
            saleStartsAt: "2099-03-01T10:00:00Z",
            imageUrl: "https://images.unsplash.com/photo-1459749411175-04bf5292ceea",
            status: "PUBLISHED",
            version: bru.getVar("eventVersion"),
          },
        });
        bru.setVar("eventVersion", changed.data.version);
    - type: tests
      code: |-
        test("the event is now CANCELED", function () {
          expect(res.getBody().status).to.equal("CANCELED");
        });

        test("returns the new version", function () {
          expect(res.getBody().version).to.equal(Number(bru.getVar("eventVersion")) + 1);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
