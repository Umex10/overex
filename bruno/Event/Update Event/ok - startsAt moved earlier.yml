info:
  name: ok - startsAt moved earlier
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/event/{{eventId}}"
  body:
    type: json
    data: |-
      {
        "title": "Frequency Festival 2027",
        "description": "Drei Tage Musik am Traisenpark in St. Pölten. Einlass ab 12:00 Uhr.",
        "categoryId": "{{categoryId}}",
        "venue": "Green Park St. Pölten",
        "city": "St. Pölten",
        "startsAt": "2027-07-01T14:00:00Z",
        "saleStartsAt": "2026-11-01T10:00:00Z",
        "imageUrl": "https://images.unsplash.com/photo-1459749411175-04bf5292ceea"
      }
  auth:
    type: bearer
    token: "{{accessTk}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("stores the earlier start", function () {
          expect(res.getBody().startsAt).to.equal("2027-07-01T14:00:00Z");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
