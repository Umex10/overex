info:
  name: fail - saleStartsAt equals startsAt
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/events/{{eventId}}"
  body:
    type: json
    data: |-
      {
        "title": "Frequency Festival 2027",
        "description": "Drei Tage Musik am Traisenpark in St. Pölten. Einlass ab 12:00 Uhr.",
        "categoryId": "{{categoryId}}",
        "venue": "Green Park St. Pölten",
        "city": "St. Pölten",
        "startsAt": "2027-08-12T14:00:00Z",
        "saleStartsAt": "2027-08-12T14:00:00Z",
        "imageUrl": "https://images.unsplash.com/photo-1459749411175-04bf5292ceea"
      }
  auth:
    type: bearer
    token: "{{accessTk}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("names saleStartsAt as the invalid field", function () {
          const fields = res.getBody().errors.map((e) => e.field);
          expect(fields).to.include("saleStartsAt");
        });

        test("explains the error in a message", function () {
          const error = res.getBody().errors.find((e) => e.field === "saleStartsAt");
          expect(error.message).to.be.a("string").and.not.be.empty;
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
