info:
  name: fail - move event start to the past (400)
  type: http
  seq: 10

http:
  method: PATCH
  url: "{{baseUrl}}/events/{{eventId}}"
  body:
    type: json
    data: |-
      {
        "title": "Bruno Testevent",
        "description": "Created by the Bruno collection.",
        "categoryId": "{{categoryId}}",
        "venue": "Green Park",
        "city": "St. Pölten",
        "startsAt": "2026-01-01T14:00:00Z",
        "saleStartsAt": "2099-03-01T10:00:00Z",
        "imageUrl": "https://images.unsplash.com/photo-1459749411175-04bf5292ceea",
        "status": "DRAFT",
        "version": {{eventVersion}}
      }
  auth:
    type: bearer
    token: "{{accessTk}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("names startsAt as the invalid field and says why", function () {
          const error = res.getBody().errors.find((e) => e.field === "startsAt");
          expect(error, "error on startsAt").to.exist;
          expect(error.message).to.equal("The new start time must be in the future.");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
