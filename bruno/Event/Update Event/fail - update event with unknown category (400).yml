info:
  name: fail - update event with unknown category (400)
  type: http
  seq: 14

http:
  method: PATCH
  url: "{{baseUrl}}/events/{{eventId}}"
  body:
    type: json
    data: |-
      {
        "title": "Bruno Testevent",
        "description": "Created by the Bruno collection.",
        "categoryId": "00000000-0000-0000-0000-000000000000",
        "venue": "Green Park",
        "city": "St. Pölten",
        "startsAt": "2099-08-12T14:00:00Z",
        "saleStartsAt": "2099-03-01T10:00:00Z",
        "imageUrl": "https://images.unsplash.com/photo-1459749411175-04bf5292ceea",
        "status": "DRAFT",
        "version": {{eventVersion}}
      }
  auth:
    type: bearer
    token: "{{accessTk}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("names categoryId as the invalid field and says why", function () {
          const error = res.getBody().errors.find((e) => e.field === "categoryId");
          expect(error, "error on categoryId").to.exist;
          expect(error.message).to.be.a("string").and.not.be.empty;
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
