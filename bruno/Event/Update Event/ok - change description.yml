info:
  name: ok - change description
  type: http
  seq: 1

http:
  method: PATCH
  url: "{{baseUrl}}/event/{{eventId}}"
  body:
    type: json
    data: |-
      {
        "title": "Frequency Festival 2027",
        "description": "Drei Tage Musik am Traisenpark in St. Pölten. Einlass ab 12:00 Uhr.",
        "categoryId": "{{categoryId}}",
        "venue": "Green Park St. Pölten",
        "city": "St. Pölten",
        "startsAt": "2027-08-12T14:00:00Z",
        "saleStartsAt": "2026-11-01T10:00:00Z",
        "imageUrl": "https://images.unsplash.com/photo-1459749411175-04bf5292ceea"
      }
  auth:
    type: bearer
    token: "{{accessTk}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const event = res.getBody();

        test("stores the new values", function () {
          expect(event.venue).to.equal("Green Park St. Pölten");
          expect(event.description).to.include("Einlass ab 12:00 Uhr");
        });

        test("keeps the id", function () {
          expect(event.id).to.equal(bru.getVar("eventId"));
        });

        test("bumps updatedAt past createdAt", function () {
          expect(new Date(event.updatedAt)).to.be.above(new Date(event.createdAt));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
