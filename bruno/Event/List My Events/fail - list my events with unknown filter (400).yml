info:
  name: fail - list my events with unknown filter (400)
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/me/events?filter=ABC"
  params:
    - name: filter
      value: "ABC"
      type: query
  auth:
    type: bearer
    token: "{{accessTk}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("names filter as the invalid field and says why", function () {
          const error = res.getBody().errors.find((e) => e.field === "filter");
          expect(error, "error on filter").to.exist;
          expect(error.message).to.be.a("string").and.not.be.empty;
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
