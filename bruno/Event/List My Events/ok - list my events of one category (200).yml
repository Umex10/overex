info:
  name: ok - list my events of one category (200)
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/me/events?categoryId={{categoryId}}"
  params:
    - name: categoryId
      value: "{{categoryId}}"
      type: query
  auth:
    type: bearer
    token: "{{accessTk}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns only events of the requested category", function () {
          const { content } = res.getBody();
          expect(content).to.be.an("array").that.is.not.empty;
          content.forEach((e) => expect(e.category.id).to.equal(bru.getVar("categoryId")));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
