info:
  name: ok - list my canceled events (200)
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/me/events?filter=CANCELED"
  params:
    - name: filter
      value: "CANCELED"
      type: query
  auth:
    type: bearer
    token: "{{accessTk}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        // Arrange: publish the draft first.
        const published = await bru.sendRequest({
          method: "PATCH",
          url: `${bru.getEnvVar("baseUrl")}/events/${bru.getVar("eventId")}`,
          headers: { Authorization: `Bearer ${bru.getVar("accessTk")}` },
          data: {
            title: "Bruno Testevent",
            description: "Created by the Bruno collection.",
            categoryId: bru.getVar("categoryId"),
            venue: "Green Park",
            city: "St. Pölten",
            startsAt: "2099-08-12T14:00:00Z",
            saleStartsAt: "2099-03-01T10:00:00Z",
            imageUrl: "https://images.unsplash.com/photo-1459749411175-04bf5292ceea",
            status: "PUBLISHED",
            version: bru.getVar("eventVersion"),
          },
        });
        bru.setVar("eventVersion", published.data.version);

        // Arrange: then cancel it.
        const changed = await bru.sendRequest({
          method: "PATCH",
          url: `${bru.getEnvVar("baseUrl")}/events/${bru.getVar("eventId")}`,
          headers: { Authorization: `Bearer ${bru.getVar("accessTk")}` },
          data: {
            title: "Bruno Testevent",
            description: "Created by the Bruno collection.",
            categoryId: bru.getVar("categoryId"),
            venue: "Green Park",
            city: "St. Pölten",
            startsAt: "2099-08-12T14:00:00Z",
            saleStartsAt: "2099-03-01T10:00:00Z",
            imageUrl: "https://images.unsplash.com/photo-1459749411175-04bf5292ceea",
            status: "CANCELED",
            version: bru.getVar("eventVersion"),
          },
        });
        bru.setVar("eventVersion", changed.data.version);
    - type: tests
      code: |-
        test("returns only CANCELED events", function () {
          const { content } = res.getBody();
          expect(content).to.be.an("array").that.is.not.empty;
          content.forEach((e) => expect(e.status).to.equal("CANCELED"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
