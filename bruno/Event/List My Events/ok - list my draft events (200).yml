info:
  name: ok - list my draft events (200)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/me/events?filter=DRAFT"
  params:
    - name: filter
      value: "DRAFT"
      type: query
  auth:
    type: bearer
    token: "{{accessTk}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns only DRAFT events", function () {
          const { content } = res.getBody();
          expect(content).to.be.an("array").that.is.not.empty;
          content.forEach((e) => expect(e.status).to.equal("DRAFT"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
