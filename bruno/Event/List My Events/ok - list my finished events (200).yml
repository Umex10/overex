info:
  name: ok - list my finished events (200)
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/me/events?filter=FINISHED"
  params:
    - name: filter
      value: "FINISHED"
      type: query
  auth:
    type: bearer
    token: "{{accessTk}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns only published events that already started", function () {
          // May be empty: the API cannot create an event in the past.
          res.getBody().content.forEach((e) => {
            expect(e.status).to.equal("PUBLISHED");
            expect(new Date(e.startsAt).getTime()).to.be.at.most(Date.now());
          });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
