info:
  name: ok - get my own account (200)
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/me"
  auth:
    type: bearer
    token: "{{accessTk}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns the signed-in user without the password", function () {
          const me = res.getBody();
          expect(me.email).to.equal("mario@overex.test");
          expect(me.role).to.equal("USER");
          expect(me).to.not.have.any.keys("password", "passwordHash");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
