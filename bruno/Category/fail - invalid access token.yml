info:
  name: fail - invalid access token
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/categories"
  auth:
    type: bearer
    token: "not-a-valid-token"

runtime:
  scripts:
    - type: tests
      code: |-
        test("a broken token is rejected even on a public route", function () {
          expect(res.getStatus()).to.equal(401);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
