info:
  name: ok - categories
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/categories"
  auth:
    type: bearer
    token: "{{accessTk}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const categories = res.getBody();

        test("returns a non-empty list", function () {
          expect(categories).to.be.an("array").that.is.not.empty;
        });

        test("every category has an id and a title", function () {
          categories.forEach((c) => {
            expect(c.id).to.match(/^[0-9a-f-]{36}$/);
            expect(c.title).to.be.a("string").and.not.be.empty;
          });
        });

        test("titles are unique", function () {
          const titles = categories.map((c) => c.title);
          expect(new Set(titles).size).to.equal(titles.length);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
