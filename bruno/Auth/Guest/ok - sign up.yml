info:
  name: ok - sign up
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/sign-up"
  body:
    type: json
    data: |-
      {
        "name": "Bruno Test",
        "email": "{{signUpEmail}}",
        "phone": "{{signUpPhone}}",
        "password": "Kennwort123!"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: before-request
      code: |-
        // A fresh account on every run: email and phone must be unique.
        const stamp = Date.now();
        bru.setVar("signUpEmail", `bruno+${stamp}@overex.test`);
        bru.setVar("signUpPhone", `+43${String(stamp).slice(-10)}`);
    - type: tests
      code: |-
        test("returns an access token", function () {
          expect(res.getBody().accessTk).to.be.a("string").and.not.be.empty;
        });

        test("the access token is valid for 15 minutes", function () {
          expect(res.getBody().expiresIn).to.equal(900);
        });

        test("sets the refresh token as an HttpOnly cookie", function () {
          const cookie = [].concat(res.getHeader("set-cookie")).join(";");
          expect(cookie).to.include("refresh_tk=");
          expect(cookie).to.include("HttpOnly");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
