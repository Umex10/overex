info:
  name: fail - wrong password
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/sign-in"
  body:
    type: json
    data: |-
      {
        "email": "mario@overex.test",
        "password": "falsch123!"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("does not say which field was wrong", function () {
          expect(res.getBody().message).to.equal("The credentials are incorrect.");
        });

        test("returns no token", function () {
          expect(res.getBody().accessTk).to.be.undefined;
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
