info:
  name: ok - me
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/me"
  auth:
    type: bearer
    token: "{{accessTk}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const me = res.getBody();

        test("returns the signed-in user", function () {
          expect(me.email).to.equal("mario@overex.test");
        });

        test("never exposes the password", function () {
          expect(me).to.not.have.any.keys("password", "passwordHash");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
