info:
  name: fail - refresh access token without refresh cookie (401)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/auth/access-tk"
  auth:
    type: none

runtime:
  scripts:
    - type: before-request
      code: |-
        // The cookie jar still holds the refresh cookie of an earlier sign-in.
        await bru.cookies.jar().clear();
    - type: tests
      code: |-
        test("says that the refresh token is missing", function () {
          expect(res.getBody()).to.equal("The refresh token is missing");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
