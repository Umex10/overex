info:
  name: fail - sign up with too short password (400)
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/auth/sign-up"
  body:
    type: json
    data: |-
      {
        "name": "Bruno Test",
        "email": "{{signUpEmail}}",
        "phone": "{{signUpPhone}}",
        "password": "kurz"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: before-request
      code: |-
        // A fresh account on every run: email and phone must be unique.
        const stamp = Date.now();
        bru.setVar("signUpEmail", `bruno+${stamp}@overex.test`);
        bru.setVar("signUpPhone", `+43${String(stamp).slice(-10)}`);
    - type: tests
      code: |-
        test("names password as the invalid field and says why", function () {
          const error = res.getBody().errors.find((e) => e.field === "password");
          expect(error, "error on password").to.exist;
          expect(error.message).to.be.a("string").and.not.be.empty;
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
