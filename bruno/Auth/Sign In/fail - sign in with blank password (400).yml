info:
  name: fail - sign in with blank password (400)
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/auth/sign-in"
  body:
    type: json
    data: |-
      {
        "email": "mario@overex.test",
        "password": ""
      }
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("names password as the invalid field and says why", function () {
          const error = res.getBody().errors.find((e) => e.field === "password");
          expect(error, "error on password").to.exist;
          expect(error.message).to.be.a("string").and.not.be.empty;
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
