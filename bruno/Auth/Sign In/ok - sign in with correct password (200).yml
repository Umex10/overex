info:
  name: ok - sign in with correct password (200)
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/sign-in"
  body:
    type: json
    data: |-
      {
        "email": "mario@overex.test",
        "password": "Kennwort123!"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns an access token that is valid for 15 minutes", function () {
          expect(res.getBody().accessTk.split(".")).to.have.lengthOf(3);
          expect(res.getBody().expiresIn).to.equal(900);
        });

        test("the token is an access token of the test user with the USER role", function () {
          const atob = require("atob");
          const part = res.getBody().accessTk.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
          const payload = JSON.parse(atob(part));
          expect(payload.type_tk).to.equal("ACCESS");
          expect(payload.roles).to.include("USER");
          expect(payload.email).to.equal("mario@overex.test");
        });

        test("sets the refresh token as an HttpOnly cookie", function () {
          const cookie = [].concat(res.getHeader("set-cookie")).join(";");
          expect(cookie).to.include("refresh_tk=");
          expect(cookie).to.include("HttpOnly");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
