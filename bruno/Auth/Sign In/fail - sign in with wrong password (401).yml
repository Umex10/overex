info:
  name: fail - sign in with wrong password (401)
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/sign-in"
  body:
    type: json
    data: |-
      {
        "email": "mario@overex.test",
        "password": "falsch123!"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("answers with the common error body", function () {
          const error = res.getBody();
          expect(error.status).to.equal(401);
          expect(error.message).to.include("The credentials are incorrect.");
          expect(error.path).to.be.a("string").and.not.be.empty;
          expect(error.errors).to.deep.equal([]);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
