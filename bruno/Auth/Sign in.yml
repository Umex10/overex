info:
  name: Sign in
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/sign-in"
  body:
    type: json
    data: |
      {
        "email": "mario@overex.test",
        "password": "Kennwort123!"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.accessTk
        method: jsonq
      variable:
        name: accessTk
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
